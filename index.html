<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarSprint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- ================= HEADER ================= -->

    <header>
        <div class="logo">
            ✦ STARSPRINT
        </div>

        <div id="headerStats" class="header-stats hidden">
            <div>
                <small>WPM</small>
                <strong id="wpm">0</strong>
            </div>

            <div>
                <small>ACCURACY</small>
                <strong id="accuracy">100%</strong>
            </div>

            <div>
                <small>PROGRESS</small>
                <strong id="progress">0%</strong>
            </div>
        </div>
    </header>


    <!-- ================= GALAXY MAP ================= -->

    <section id="galaxyScreen">

        <div class="galaxy-bg"></div>

        <div class="galaxy-content">

            <div class="title-small">
                STARSPRINT NETWORK
            </div>

            <h1>SELECT A SECTOR</h1>

            <p class="subtitle">
                Choose your destination.
            </p>

            <div class="sector-grid">

                <button class="sector selected" data-sector="0">
                    <div class="sector-icon">🌌</div>
                    <strong>ORION GATE</strong>
                    <span>Beginner</span>
                </button>

                <button class="sector" data-sector="1">
                    <div class="sector-icon">☄️</div>
                    <strong>ASTEROID RUN</strong>
                    <span>Intermediate</span>
                </button>

                <button class="sector locked" data-sector="2">
                    <div class="sector-icon">🪐</div>
                    <strong>GIANT'S RING</strong>
                    <span>Locked</span>
                </button>

                <button class="sector locked" data-sector="3">
                    <div class="sector-icon">🕳️</div>
                    <strong>VOID EDGE</strong>
                    <span>Locked</span>
                </button>

            </div>

            <div class="sector-info">
                <div>
                    <span>RACE LENGTH</span>
                    <b id="sectorLength">SHORT</b>
                </div>

                <div>
                    <span>AI LEVEL</span>
                    <b id="sectorDifficulty">BEGINNER</b>
                </div>

                <div>
                    <span>REWARD</span>
                    <b id="sectorReward">100 CR</b>
                </div>
            </div>

            <button id="launchButton" class="main-button">
                LAUNCH RACE
            </button>

        </div>

    </section>


    <!-- ================= RACE ================= -->

    <section id="raceScreen" class="hidden">

        <div id="space">

            <div class="stars"></div>

            <div class="planet planet-one"></div>
            <div class="planet planet-two"></div>

            <div class="asteroid asteroid-one"></div>
            <div class="asteroid asteroid-two"></div>
            <div class="asteroid asteroid-three"></div>
            <div class="asteroid asteroid-four"></div>

            <div id="finishLine"></div>

            <!-- LANES -->
            <div id="lanes"></div>

            <!-- SHIPS ARE INSERTED HERE -->

        </div>


        <!-- COUNTDOWN -->

        <div id="countdown"></div>


        <!-- TYPING -->

        <section id="typingArea">

            <div id="textDisplay"></div>

            <input
                id="typingInput"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                disabled
            >

            <div class="typing-info">

                <span>
                    CHARACTERS:
                    <b id="characters">0 / 0</b>
                </span>

                <span>
                    ERRORS:
                    <b id="errors">0</b>
                </span>

            </div>

        </section>

    </section>


    <!-- ================= RESULTS ================= -->

    <section id="resultsScreen" class="overlay hidden">

        <div class="results-panel">

            <div class="result-icon" id="resultIcon">
                ★
            </div>

            <div class="title-small">
                RACE RESULTS
            </div>

            <h1 id="resultTitle">
                VICTORY
            </h1>

            <div id="leaderboard"></div>

            <div class="personal-results">

                <div>
                    <span>WPM</span>
                    <strong id="finalWpm">0</strong>
                </div>

                <div>
                    <span>ACCURACY</span>
                    <strong id="finalAccuracy">100%</strong>
                </div>

                <div>
                    <span>REWARD</span>
                    <strong id="finalReward">0 CR</strong>
                </div>

            </div>

            <button id="againButton" class="main-button">
                RACE AGAIN
            </button>

            <button id="mapButton" class="secondary-button">
                GALAXY MAP
            </button>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
